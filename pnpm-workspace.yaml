packages:
  - 'apps/*'
  - 'packages/*'

# Paket yang boleh menjalankan build script saat install (pnpm >= 10 memblokir
# secara default). Ditambah satu per satu sesuai kebutuhan, bukan diizinkan
# menyeluruh — build script adalah jalur eksekusi kode saat `pnpm install`.
allowBuilds:
  '@biomejs/biome': true
  argon2: true
  esbuild: true
