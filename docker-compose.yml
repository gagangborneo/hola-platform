name: hola

# Infra lokal saja: postgres, redis, RustFS, mailpit.
# hola-api / hola-web / hola-admin / hola-worker TIDAK ada di sini — dijalankan
# di host lewat `pnpm dev` supaya hot reload cepat (docs/02-INFRASTRUCTURE.md § 11).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hola
      POSTGRES_USER: hola
      POSTGRES_PASSWORD: hola
      TZ: Asia/Makassar
    ports:
      - '5432:5432'
    volumes:
      - hola_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hola -d hola']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hola-redis
    restart: unless-stopped
    # 3 flag wajib — docs/02-INFRASTRUCTURE.md § 2.
    # noeviction: hold slot & job BullMQ tidak boleh dievict secara senyap.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    environment:
      TZ: Asia/Makassar
    ports:
      - '6379:6379'
    volumes:
      - hola_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: hola-rustfs
    restart: unless-stopped
    environment:
      # Akun root server; app API memakai S3_ACCESS_* dan dapat berupa service
      # account dengan izin bucket yang sama. Untuk dev, keduanya disamakan.
      RUSTFS_ACCESS_KEY: ${S3_RUSTFS_ACCESS:-hola}
      RUSTFS_SECRET_KEY: ${S3_RUSTFS_SECRET:-hola12345}
      RUSTFS_CONSOLE_ENABLE: 'true'
      TZ: Asia/Makassar
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - hola_rustfsdata:/data
      - hola_rustfslogs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20

  # Job sekali jalan: membuat 3 bucket, lalu keluar.
  rustfs-init:
    image: minio/mc
    container_name: hola-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://rustfs:9000 ${S3_RUSTFS_ACCESS:-hola} ${S3_RUSTFS_SECRET:-hola12345}
        mc mb --ignore-existing local/hola-media
        mc mb --ignore-existing local/hola-private
        mc mb --ignore-existing local/hola-backup
        mc anonymous set download local/hola-media
        echo "bucket siap: hola-media (public read), hola-private, hola-backup"

  mailpit:
    image: axllent/mailpit
    container_name: hola-mailpit
    restart: unless-stopped
    environment:
      TZ: Asia/Makassar
      MP_MAX_MESSAGES: '500'
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hola_pgdata:
  hola_redisdata:
  hola_rustfsdata:
  hola_rustfslogs:
