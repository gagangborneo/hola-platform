name: hola

# Infra lokal saja: postgres, redis, minio, mailpit.
# hola-api / hola-web / hola-admin / hola-worker TIDAK ada di sini — dijalankan
# di host lewat `pnpm dev` supaya hot reload cepat (docs/02-INFRASTRUCTURE.md § 11).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hola
      POSTGRES_USER: hola
      POSTGRES_PASSWORD: hola
      TZ: Asia/Makassar
    ports:
      - '5432:5432'
    volumes:
      - hola_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hola -d hola']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hola-redis
    restart: unless-stopped
    # 3 flag wajib — docs/02-INFRASTRUCTURE.md § 2.
    # noeviction: hold slot & job BullMQ tidak boleh dievict secara senyap.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    environment:
      TZ: Asia/Makassar
    ports:
      - '6379:6379'
    volumes:
      - hola_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: hola-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hola
      MINIO_ROOT_PASSWORD: hola12345
      TZ: Asia/Makassar
    # Port host dapat di-override lewat .env bila bentrok dengan layanan lain
    # di mesin developer. Default tetap 9000/9001 (docs/02-INFRASTRUCTURE.md § 11).
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - hola_miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Job sekali jalan: membuat 3 bucket, lalu keluar.
  minio-init:
    image: minio/mc
    container_name: hola-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 hola hola12345
        mc mb --ignore-existing local/hola-media
        mc mb --ignore-existing local/hola-private
        mc mb --ignore-existing local/hola-backup
        mc anonymous set download local/hola-media
        echo "bucket siap: hola-media (public read), hola-private, hola-backup"

  mailpit:
    image: axllent/mailpit
    container_name: hola-mailpit
    restart: unless-stopped
    environment:
      TZ: Asia/Makassar
      MP_MAX_MESSAGES: '500'
    # Port host dapat di-override lewat .env bila bentrok (lihat minio).
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hola_pgdata:
  hola_redisdata:
  hola_miniodata:
